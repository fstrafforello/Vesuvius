[project]
name = "psn-vesuvius"
version = "0.1.0"
description = "Independent surface tracing and cross-scroll ink detection for the Vesuvius Challenge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "zarr",
    "tensorstore",
    "fsspec[http]",
    "tifffile",
    "imagecodecs",
    "scikit-image",
    "opencv-python-headless",
    "matplotlib",
    "tqdm",
    "requests",
    "segmentation-models-pytorch",
    "albumentations",
    "trimesh",
    "jupyterlab",
    "ipywidgets",
    "napari[pyqt6]",
    "vesuvius",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
